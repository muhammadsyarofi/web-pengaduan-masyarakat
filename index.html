<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>Masuk — Pengaduan Desa Luwung</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pengaduan Luwung">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="offlineBar" class="offline-bar" role="status"></div>
  <main class="landing">
    <div class="landing-card">
  <div class="landing-hero">
    <img
      class="landing-photo"
      src="images/image.png"
      alt="Pendopo / Balai Desa Luwung"
      width="750"
      height="375"
    >
    <div class="landing-hero-overlay"></div>
    <div class="landing-hero-caption">
      <span class="landing-badge">Pemerintah Desa</span>
    </div>
  </div>
  <div class="landing-body">
    <div class="landing-brand">
      <h1>Pengaduan Masyarakat<br>Desa Luwung</h1>
      <p>Kecamatan Mundu, Kabupaten Cirebon, Jawa Barat</p>
    </div>

      <div class="tabs" role="tablist">
        <button type="button" class="active" id="tabLogin" role="tab" aria-selected="true">Masuk</button>
        <button type="button" id="tabDaftar" role="tab" aria-selected="false">Daftar Akun</button>
      </div>

      <div class="demo-info">
        <strong>Akun demo warga:</strong> username <code>warga</code> / password <code>warga123</code><br>
        Admin perangkat desa: buka <a href="admin.html">halaman admin</a>
      </div>

      <!-- LOGIN -->
      <div class="auth-panel active" id="panelLogin">
        <form id="formLoginWarga">
          <div class="form-group">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" class="form-control" required autocomplete="username" placeholder="Masukkan username">
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" required autocomplete="current-password" placeholder="Masukkan password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Masuk</button>
        </form>
      </div>

      <!-- DAFTAR -->
      <div class="auth-panel" id="panelDaftar">
        <form id="formDaftar">
          <div class="form-group">
            <label for="regNama">Nama Lengkap</label>
            <input type="text" id="regNama" class="form-control" required autocomplete="name" placeholder="Nama sesuai KTP">
          </div>
          <div class="form-group">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" class="form-control" required autocomplete="username" placeholder="Minimal 3 karakter">
          </div>
          <div class="form-group">
            <label for="regWhatsapp">Nomor WhatsApp</label>
            <input type="tel" id="regWhatsapp" class="form-control" required inputmode="tel" placeholder="08xxxxxxxxxx">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group">
              <label for="regRt">RT</label>
              <input type="text" id="regRt" class="form-control" placeholder="01" maxlength="3">
            </div>
            <div class="form-group">
              <label for="regRw">RW</label>
              <input type="text" id="regRw" class="form-control" placeholder="01" maxlength="3">
            </div>
          </div>
          <div class="form-group">
            <label for="regDusun">Dusun / Blok</label>
            <input type="text" id="regDusun" class="form-control" placeholder="Contoh: Blok A">
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" class="form-control" required autocomplete="new-password" placeholder="Minimal 6 karakter">
          </div>
          <div class="form-group">
            <label for="regPassword2">Konfirmasi Password</label>
            <input type="password" id="regPassword2" class="form-control" required autocomplete="new-password" placeholder="Ulangi password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Daftar Akun</button>
        </form>
      </div>

      <div class="auth-footer">
        Data akun disimpan di perangkat Anda (demo).<br>
        <a href="admin.html">Masuk sebagai Admin Desa</a>
      </div>
  </div><!-- /landing-body -->
    </div><!-- /landing-card -->
  </main>
  <div class="toast-container" aria-live="polite"></div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (Storage.isUserLoggedIn()) {
        window.location.href = 'beranda.html';
        return;
      }
      LuwungApp.initLanding();
    });
  </script>
  <script src="js/platform.js"></script>
</body>
</html>
